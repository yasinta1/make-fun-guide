name: Add repository screenshot

on:
  push:
    paths:
      - '.github/workflows/screenshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps

      - name: Capture full-page screenshot
        run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1920, "height": 1000})
              page.goto("https://github.com/yasinta1/make-fun-guide", wait_until="load")
              page.wait_for_timeout(3000)
              page.screenshot(path="screenshot.png", full_page=True)
              browser.close()
          EOF
          file screenshot.png
          ls -l screenshot.png

      - name: Commit screenshot
        run: |
          git config user.name "yasinta1"
          git config user.email "yasinta1@users.noreply.github.com"
          git add screenshot.png
          git commit -m "Add screenshot of the repository page"
          git push
